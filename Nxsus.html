<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NXSUS GAMING</title>

<script src="https://unpkg.com/vue@3"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

<header>
<img src="Logo-NXSUS.png" alt="Logo NXSUS" class="logo">
<h1>NXSUS GAMING</h1>
<p>Tienda Oficial de Videojuegos</p>
</header>

<nav>
<ul>
<li><a href="juegos.html">Mis juegos</a></li>
<li><a href="#">Lista de deseos</a></li>
<li><a href="#">Carrito</a></li>
<li><a href="perfil.html">Perfil</a></li>
</ul>
</nav>

<main class="container">

<section class="main-content">

<h2>En tendencia</h2>

<transition-group name="cards" tag="div">

<article v-for="juego in juegos" :key="juego.nombre">

<h3>{{ juego.nombre }}</h3>

<img :src="juego.imagen" :alt="juego.nombre">

<p>{{ juego.descripcion }}</p>

</article>

</transition-group>

</section>

<aside>

<h3>Categoría</h3>

<ul>

<li v-for="categoria in categorias" :key="categoria">
<a href="#">{{ categoria }}</a>
</li>

</ul>

</aside>

</main>

<footer>
<p>&copy; 2026 - Creado por Ebfapa con HTML5</p>
</footer>

</div>

<script>

const { createApp } = Vue

createApp({

data(){

return{

juegos:[

{
nombre:"Mortal Kombat 1",
imagen:"MK1.jpg",
descripcion:"Juego de peleas brutal con los personajes clásicos."
},

{
nombre:"Cyber Future 2077",
imagen:"cyber.jpg",
descripcion:"Explora una ciudad futurista llena de tecnología."
},

{
nombre:"Speed Racers Pro",
imagen:"racing.jpg",
descripcion:"Carreras de alta velocidad con gráficos realistas."
}

],

categorias:[
"Shooters",
"Estrategias",
"Mundo Abierto",
"Deportes",
"Arcade",
"Offline",
"Gratuitos"
]

}

}

}).mount("#app")

</script>

</body>
</html>
